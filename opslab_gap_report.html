<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpsLab · Gap Analysis · Випробувальний</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2EDE6;
  --surface: #FAF7F3;
  --s2: #FFFFFF;
  --s3: #F4F1EA;
  --border: rgba(26,26,26,0.09);
  --border2: rgba(26,26,26,0.15);
  --text: #1A1A1A;
  --muted: #6E6A62;
  --hint: #9A968C;
  --blue: #2F6F8F;
  --blue-bg: rgba(47,111,143,0.1);
  --blue-b: rgba(47,111,143,0.3);
  --green: #2D7A47;
  --green-bg: rgba(45,122,71,0.1);
  --green-b: rgba(45,122,71,0.3);
  --amber: #B06A18;
  --amber-bg: rgba(176,106,24,0.12);
  --amber-b: rgba(176,106,24,0.32);
  --red: #E5541B;
  --red-bg: rgba(229,84,27,0.1);
  --red-b: rgba(229,84,27,0.3);
  --purple: #7A5AA8;
  --purple-bg: rgba(122,90,168,0.1);
  --purple-b: rgba(122,90,168,0.3);
  --teal: #2E7D7A;
  --teal-bg: rgba(46,125,122,0.1);
  --teal-b: rgba(46,125,122,0.3);
  --accent: #E5541B;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
.page { max-width: 1100px; margin: 0 auto; padding: 40px 32px 80px; }

/* Header */
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
.logo-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--blue-bg); border: 1px solid var(--blue-b); display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--blue); }
.logo-text { font-size: 13px; color: var(--muted); }

/* Search */
.search-block { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; padding: 20px; margin-bottom: 32px; }
.search-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 12px; }
.search-row { display: flex; gap: 10px; }
.search-input { flex: 1; background: var(--s2); border: 1px solid var(--border2); border-radius: 8px; padding: 9px 12px; font-size: 13px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; }
.search-input:focus { border-color: var(--blue-b); }
.search-input::placeholder { color: var(--hint); }
.search-btn { padding: 9px 20px; background: var(--blue-bg); border: 1px solid var(--blue-b); border-radius: 8px; color: var(--blue); font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; }
.search-btn:hover { background: rgba(78,143,232,0.2); }
.search-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.search-status { font-size: 12px; color: var(--muted); margin-top: 8px; }

/* Report */
#report { display: none; }

.report-header { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
.report-name { font-size: 26px; font-weight: 300; letter-spacing: -.01em; margin-bottom: 6px; }
.report-name strong { font-weight: 500; }
.report-meta { font-size: 13px; color: var(--muted); }

/* Summary cards */
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 32px; }
.summary-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 16px 18px; border-top: 3px solid var(--border2); }
.summary-card.empty { opacity: 0.4; }
.summary-card.self-c { border-top-color: var(--green); background: linear-gradient(var(--green-bg), transparent 60%), var(--surface); }
.summary-card.mentor-c { border-top-color: var(--amber); background: linear-gradient(var(--amber-bg), transparent 60%), var(--surface); }
.summary-card.peer-c { border-top-color: var(--teal); background: linear-gradient(var(--teal-bg), transparent 60%), var(--surface); }
.sc-role { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.sc-role.self { color: var(--green); }
.sc-role.mentor { color: var(--amber); }
.sc-role.peer { color: var(--teal); }
.sc-avg { font-size: 32px; font-weight: 300; letter-spacing: -.02em; }
.sc-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Section */
.section { margin-bottom: 28px; }
.section-header { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; color: var(--hint); letter-spacing: .06em; text-transform: uppercase; padding: 7px 0 12px; border-top: 1px solid var(--border); margin-bottom: 12px; }

/* Gap bars */
.criteria-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.block-header { grid-column: 1 / -1; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin: 20px 0 4px; display: flex; align-items: center; gap: 10px; }
.block-header:before { content: ""; width: 22px; height: 3px; border-radius: 2px; background: var(--accent); }
.block-header:after { content: ""; flex: 1; height: 1px; background: var(--border); }
.criterion-row { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 16px 18px; }
.cr-label { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
.bars { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.bar-row { display: flex; align-items: center; gap: 12px; }
.bar-role { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); width: 80px; flex-shrink: 0; }
.bar-track { flex: 1; height: 14px; background: rgba(26,26,26,0.05); border-radius: 7px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 7px; transition: width .7s cubic-bezier(.4,0,.2,1); min-width: 3px; }
.bar-fill.self { background: var(--green); }
.bar-fill.mentor { background: var(--amber); }
.bar-fill.peer { background: var(--teal); }
.bar-val { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--text); width: 20px; text-align: right; flex-shrink: 0; }
.gap-badge { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; padding: 2px 7px; border-radius: 10px; margin-left: 8px; }
.gap-ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-b); }
.gap-warn { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-b); }
.gap-crit { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-b); }

/* Ipsative */
.ip-block { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 0; margin-bottom: 10px; overflow: hidden; border-left: 3px solid var(--border2); }
.ip-block.is-match { border-left-color: var(--green); }
.ip-block.is-diff { border-left-color: var(--amber); }
.ip-top { padding: 14px 18px; }
.ip-criterion { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 12px; }
.ip-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ip-side { border-radius: 8px; padding: 10px 12px; border: 1px solid var(--border); background: var(--s2); }
.ip-side-role { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: .05em; text-transform: uppercase; color: var(--hint); margin-bottom: 5px; }
.ip-side-choice { font-size: 12.5px; line-height: 1.45; color: var(--text); }
.ip-side-tag { display: inline-block; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; padding: 1px 6px; border-radius: 4px; margin-bottom: 6px; }
.ip-side.opslab { border-color: var(--green-b); background: var(--green-bg); }
.ip-side.opslab .ip-side-tag { background: var(--green); color: #fff; }
.ip-side.alt { border-color: var(--amber-b); background: var(--amber-bg); }
.ip-side.alt .ip-side-tag { background: var(--amber); color: #fff; }
.ip-verdict { font-size: 11px; font-family: 'DM Mono', monospace; letter-spacing: .04em; text-transform: uppercase; margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; }
.ip-verdict.match { background: var(--green-bg); color: var(--green); }
.ip-verdict.diff { background: var(--amber-bg); color: var(--amber); }
.ip-example { border-top: 1px solid var(--border); background: rgba(26,26,26,0.015); padding: 12px 18px; }
.ip-example-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--hint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.ip-example-self { font-size: 12.5px; color: var(--text); line-height: 1.55; margin-bottom: 8px; }
.ip-example-mentor { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.ip-role-tag { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }

/* Trust */
.trust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.trust-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-align: center; }
.trust-role { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.trust-score { font-size: 36px; font-weight: 300; letter-spacing: -.02em; margin-bottom: 4px; }
.trust-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }

/* Redflags */
.redflag-list { background: var(--red-bg); border: 1px solid var(--red-b); border-radius: 12px; padding: 14px 16px; }
.rf-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.rf-item:last-child { margin-bottom: 0; }
.rf-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; margin-top: 5px; }
.no-flags { font-size: 12px; color: var(--green); }

/* Open questions */
.open-block { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 7px; }
.open-role { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; color: var(--hint); }
.open-q { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
.open-a { font-size: 13px; color: var(--text); line-height: 1.65; }

/* Decision */
.decision-block { background: var(--green-bg); border: 1px solid var(--green-b); border-radius: 12px; padding: 16px 18px; }
.decision-label { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--green); margin-bottom: 8px; }
.decision-text { font-size: 14px; color: var(--text); line-height: 1.65; }

.legend-block { background: var(--s2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.legend-title { font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .04em; font-family: 'DM Mono', monospace; }
.legend-grid { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.legend-scale { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.legend-scale-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.scale-badge { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; color: var(--text); background: var(--s3); padding: 1px 6px; border-radius: 4px; }
.legend-gaps { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.cr-desc { font-size: 11px; color: var(--hint); margin-bottom: 10px; line-height: 1.5; font-style: italic; }
.discussion-intro { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
.discussion-q { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 7px; }
.dq-type { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
.dq-text { font-size: 13px; color: var(--text); line-height: 1.65; }
.open-intro { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
/* Ipsative improvements */
.ip-q-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; line-height: 1.5; }
.ip-variants { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 8px; }
.ip-variant { padding: 10px 12px; border-radius: 8px; background: var(--s2); border: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; align-items: flex-start; gap: 8px; }
.ip-variant.highlighted-a { border-color: var(--amber-b); }
.ip-variant.highlighted-b { border-color: var(--green-b); color: var(--text); }
.ip-v-label { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; color: var(--hint); flex-shrink: 0; margin-top: 1px; }
.ip-opslab-note { font-size: 11px; color: var(--purple); background: var(--purple-bg); border: 1px solid var(--purple-b); border-radius: 6px; padding: 5px 10px; margin-bottom: 10px; }
/* Interpretation */
.interp-grade { border: 1px solid; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.interp-grade-label { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
.interp-grade-text { font-size: 16px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.interp-grade-avg { font-size: 13px; color: var(--muted); }
.interp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.interp-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.interp-card-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.interp-sub { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.interp-item { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 5px; line-height: 1.4; }
.interp-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.interp-opslab { background: var(--purple-bg); border: 1px solid var(--purple-b); border-radius: 12px; padding: 14px 16px; }
.verdict-box { border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; border: 1px solid var(--border2); background: var(--surface); border-left: 4px solid var(--accent); }
.verdict-headline { font-size: 18px; font-weight: 500; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
.verdict-avg { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.verdict-avg strong { color: var(--text); }
.verdict-sub { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--hint); margin: 14px 0 8px; }
.dip-row { display: flex; align-items: baseline; gap: 12px; padding: 8px 12px; border-radius: 8px; background: var(--amber-bg); border: 1px solid var(--amber-b); margin-bottom: 6px; flex-wrap: wrap; }
.dip-name { font-size: 13px; font-weight: 500; color: var(--text); flex-shrink: 0; min-width: 180px; }
.dip-scores { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--amber); flex-shrink: 0; }
.dip-eg { font-size: 12px; color: var(--muted); line-height: 1.5; flex: 1; min-width: 200px; }
.strong-row { display: flex; align-items: baseline; gap: 12px; padding: 6px 12px; border-radius: 8px; background: var(--green-bg); border: 1px solid var(--green-b); margin-bottom: 6px; }
.strong-name { font-size: 13px; font-weight: 500; color: var(--text); flex-shrink: 0; min-width: 180px; }
.strong-scores { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--green); }
.pdp-box { border: 1px solid var(--blue-b); background: var(--blue-bg); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
.pdp-title { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--blue); margin-bottom: 4px; }
.pdp-lede { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
.pdp-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(26,26,26,0.05); font-size: 13px; line-height: 1.55; color: var(--text); }
.pdp-item:last-child { border-bottom: none; }
.pdp-num { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--blue); color: #fff; font-family: 'DM Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.pdp-item strong { font-weight: 500; }
.pdp-item .why { color: var(--muted); font-size: 12px; }
/* Comment */
.comment-intro { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.6; }
/* Development block */
.dev-transition { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
.dev-transition-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 12px; }
.dev-criteria { display: flex; flex-direction: column; gap: 6px; }
.dev-criterion { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; padding: 8px 12px; border-radius: 8px; }
.dev-criterion.passed { color: var(--green); background: var(--green-bg); }
.dev-criterion.failed { color: var(--muted); background: var(--s2); }
.dev-criterion.critical { color: var(--red); background: var(--red-bg); }
.dev-criterion.no-data { color: var(--hint); background: transparent; }
.dev-icon { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; flex-shrink: 0; width: 16px; }
.dev-na { font-size: 10px; color: var(--hint); margin-left: 6px; font-style: italic; }
.dev-goals-title { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; color: var(--hint); letter-spacing: .06em; text-transform: uppercase; margin: 16px 0 10px; }
.dev-goal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; }
.dev-goal-critical { border-color: var(--red-b); background: var(--red-bg); }
.dev-goal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.dev-goal-num { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; color: var(--hint); width: 20px; flex-shrink: 0; }
.dev-goal-source { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
.dev-goal-text { font-size: 13px; color: var(--text); line-height: 1.65; padding-left: 30px; }
/* Context block */
.ctx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.ctx-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.ctx-card-title { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; color: var(--hint); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 12px; }
.ctx-field { margin-bottom: 10px; }
.ctx-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.ctx-input { width: 100%; background: var(--s2); border: 1px solid var(--border2); border-radius: 6px; padding: 7px 10px; font-size: 13px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; }
.ctx-input:focus { border-color: var(--blue-b); }
.ctx-input::placeholder { color: var(--hint); }
.ctx-select { width: 100%; background: var(--s2); border: 1px solid var(--border2); border-radius: 6px; padding: 7px 10px; font-size: 13px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; }
.ctx-select:focus { border-color: var(--blue-b); }
.ctx-row { display: grid; grid-template-columns: 1fr 80px; gap: 8px; }
.ctx-intro { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
.ctx-saved { font-size: 11px; color: var(--green); margin-top: 6px; display: none; }
.mentor-comment { width: 100%; background: var(--s2); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text); font-family: 'DM Sans', sans-serif; resize: vertical; min-height: 100px; outline: none; line-height: 1.6; margin-bottom: 10px; }
.mentor-comment:focus { border-color: var(--blue-b); }
.comment-btn { padding: 9px 20px; background: var(--blue-bg); border: 1px solid var(--blue-b); border-radius: 8px; color: var(--blue); font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.comment-btn:hover { background: rgba(78,143,232,0.2); }
.comment-btn:disabled { opacity: .4; cursor: not-allowed; }
.comment-status { font-size: 12px; margin-top: 8px; }
.open-compare-block { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 8px; }
.ocb-q { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 14px; }
.ocb-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.ocb-role { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }

async function loadReport() {
  const name = document.getElementById('manager-input').value.trim();
  if (!name) { setStatus('Введи імʼя менеджера'); return; }

  const btn = document.getElementById('search-btn');
  btn.disabled = true;
  setStatus('Завантажуємо дані...');

  try {
    const res = await fetch(SHEET_URL + '&sheet=Sheet1');
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const rows = json.table.rows;
    const cols = json.table.cols.map(c => c.label.trim());

    const getVal = (row, colName) => {
      let idx = cols.findIndex(c => c.trim() === colName.trim());
      if (idx < 0 && colName === 'manager_name') {
        idx = cols.findIndex(c => c.trim().startsWith('manager_nam'));
      }
      if (idx < 0) return null;
      const cell = row.c[idx];
      return cell && cell.v !== null ? String(cell.v).trim() : null;
    };

    const managerRows = rows.filter(row => {
      if (!row.c || row.c.every(cell => !cell || cell.v === null)) return false;
      const mn = getVal(row, 'manager_name');
      return mn && mn.toLowerCase().includes(name.toLowerCase());
    });

    if (managerRows.length === 0) {
      setStatus(`Не знайдено даних для "${name}". Перевір імʼя.`);
      btn.disabled = false;
      return;
    }

    const data = { self: null, mentor: null, peer: null, mentors: [], peers: [], contextData: null };
    managerRows.forEach(row => {
      const role = getVal(row, 'evaluator_role');
      if (role === 'self') data.self = row;
      else if (role === 'mentor') { data.mentors.push(row); data.mentor = row; }
      else if (role === 'peer') { data.peers.push(row); data.peer = row; }
      else if (role === 'context_data') data.contextData = row;
    });

    // Усереднюємо менторів і peer якщо їх кілька
    const avgRows = (rows, col) => {
      const vals = rows.map(r => getVal(r, col)).filter(v => v && !isNaN(parseFloat(v))).map(v => parseFloat(v));
      return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : null;
    };

    // Створюємо агреговані рядки для ментора і peer
    if (data.mentors.length > 1) {
      data._mentorAvg = true;
      data._mentorCount = data.mentors.length;
    }
    if (data.peers.length > 1) {
      data._peerAvg = true;
      data._peerCount = data.peers.length;
    }

    // Функція для отримання усередненого значення
    data._getAvgVal = (role, col) => {
      if (role === 'self') return data.self ? getVal(data.self, col) : null;
      const rows = role === 'mentor' ? data.mentors : role === 'peer' ? data.peers : [];
      if (rows.length === 0) return null;
      if (rows.length === 1) return getVal(rows[0], col);
      return avgRows(rows, col);
    };

    // Ipsative — більшість голосів
    data._getIpsative = (role, col) => {
      const rows = role === 'mentor' ? data.mentors : role === 'peer' ? data.peers : [];
      if (rows.length === 0) return null;
      if (rows.length === 1) return getVal(rows[0], col);
      const votes = {};
      rows.forEach(r => { const v = getVal(r, col); if (v) votes[v] = (votes[v]||0)+1; });
      return Object.keys(votes).sort((a,b)=>votes[b]-votes[a])[0] || null;
    };

    const managerName = getVal(managerRows[0], 'manager_name');
    const managerRole = data.self ? getVal(data.self, 'manager_role') : '';

    setStatus(`Знайдено: ${managerRows.length} відповід${managerRows.length === 1 ? 'ь' : 'і'}`);
    renderReport(managerName, managerRole, data, cols, getVal);
  } catch(e) {
    setStatus('Помилка завантаження. Перевір доступ до таблиці.');
    console.error(e);
  }
  btn.disabled = false;
}

function renderReport(name, role, data, cols, getVal) {
  const scores = { self: {}, mentor: {}, peer: {} };
  // ініціалізуємо всі критерії як null
  ['self','mentor','peer'].forEach(r => {
    AXES.forEach(a => { scores[r][a.key] = null; });
  });

  ['self','mentor','peer'].forEach(r => {
    const rows = r === 'mentor' ? data.mentors : r === 'peer' ? data.peers : data.self ? [data.self] : [];
    if (rows.length === 0) return;
    AXES.forEach(a => {
      const field = axisField(a.key);
      const val = data._getAvgVal ? data._getAvgVal(r, field) : getVal(rows[0], field);
      scores[r][a.key] = (val !== null && val !== undefined && val !== '' && !isNaN(parseFloat(val))) ? parseFloat(val) : null;
    });
  });

  const avg = r => {
    const rows = r === 'mentor' ? data.mentors : r === 'peer' ? data.peers : data.self ? [data.self] : [];
    if (rows.length === 0) return null;
    const vals = AXES.map(a => scores[r][a.key]).filter(v => v !== null);
    return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : null;
  };

  const gap = (a, b) => {
    if (a === null || b === null) return null;
    return Math.abs(a - b);
  };

  const gapBadge = (selfVal, mentorVal) => {
    const g = gap(selfVal, mentorVal);
    if (g === null) return '';
    if (g <= 0.5) return '<span class="gap-badge gap-ok">Збіг</span>';
    if (g <= 1) return '<span class="gap-badge gap-warn">±' + g.toFixed(1) + '</span>';
    return '<span class="gap-badge gap-crit">Розрив ' + g.toFixed(1) + '</span>';
  };

  const barPct = v => v ? ((v/4)*100).toFixed(0) + '%' : '0%';

  const filledCount = [data.self, data.mentors.length > 0, data.peers.length > 0].filter(Boolean).length;
  const mentorLabel = data.mentors.length > 1 ? `Ментори · ${data.mentors.length}` : 'Ментор';
  const peerLabel = data.peers.length > 1 ? `Peer · ${data.peers.length}` : 'Peer';

  let html = `
    <div class="report-header">
      <div class="report-name"><strong>${name}</strong></div>
      <div class="report-meta">${role || 'Middle Fractional OM'} · Звіт після 3 місяців · ${filledCount}/3 форм заповнено</div>
    </div>

    <div class="summary-grid">
      <div class="summary-card self-c ${!data.self ? 'empty' : ''}">
        <div class="sc-role self">Самооцінка</div>
        <div class="sc-avg">${avg('self') || '—'}</div>
        <div class="sc-label">${data.self ? 'середнє з 4' : 'не заповнено'}</div>
      </div>
      <div class="summary-card mentor-c ${data.mentors.length === 0 ? 'empty' : ''}">
        <div class="sc-role mentor">${mentorLabel}</div>
        <div class="sc-avg">${avg('mentor') || '—'}</div>
        <div class="sc-label">${data.mentors.length > 0 ? 'середнє з 4' : 'не заповнено'}</div>
      </div>
      <div class="summary-card peer-c ${data.peers.length === 0 ? 'empty' : ''}">
        <div class="sc-role peer">${peerLabel}</div>
        <div class="sc-avg">${avg('peer') || '—'}</div>
        <div class="sc-label">${data.peers.length > 0 ? 'середнє з 4' : 'не заповнено'}</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">Gap Analysis · осі грейду по блоках</div>

      <div class="legend-block">
        <div class="legend-title">Як читати цей звіт</div>
        <div class="legend-grid">

  // === INTERPRETATION BLOCK ===
  const allScores = AXES.map(a => ({

  const isMiddle = currentRole.includes('middle');

  // Проксі-сигнали для випробувального: фінальних цифр (LTV 10+) ще нема,
  // тому дивимось на churn, продовження, тест довіри, зони росту і середню.
  const ctxChurn = ctx ? getVal(ctx, 'churn') : null;
  const ctxContinuation = ctx ? getVal(ctx, 'continuation') : null;

  let nextGradeNote = '';
  {
    const readySignals = [];
    const notReadySignals = [];

    if (mentorAvgNum >= 3.5) readySignals.push('середня ментора ' + mentorAvgNum.toFixed(1));
    else if (mentorAvgNum >= 3.0) readySignals.push('середня ментора ' + mentorAvgNum.toFixed(1) + ' (в межах входу)');
    else if (mentorAvgNum > 0) notReadySignals.push('середня ментора ' + mentorAvgNum.toFixed(1) + ' нижче входу');

    if (ctxChurn === 'Не було') readySignals.push('немає churn');
    else if (ctxChurn && ctxChurn !== '— не вибрано' && ctxChurn !== 'Не було') notReadySignals.push('був churn — потрібен глибокий аналіз з CEO');

    if (ctxContinuation === 'Всі продовжуються') readySignals.push('всі клієнти продовжуються');
    else if (ctxContinuation === 'Більшість') readySignals.push('більшість продовжуються');
    else if (ctxContinuation === 'Є відтік') notReadySignals.push('є відтік клієнтів');

    if (ctxCaseStudy === 'Так') readySignals.push('є case studies');
    if (avgTrustNum >= 3.5) readySignals.push('тест на довіру ' + avgTrustNum.toFixed(1) + '/4');

    const weakAxes = growthAreas.slice(0,3).map(s=>s.label);
    if (growthAreas.length >= 3) notReadySignals.push('просідає: ' + weakAxes.slice(0,2).join(', '));

    const trustBonus = avgTrustNum >= 4 ? 1 : 0;
    const effectiveReady = readySignals.length + trustBonus;

    // Головний сценарій: чи підтверджено вхід у Middle
    if (mentorAvgNum >= 3.0 && effectiveReady >= 3 && notReadySignals.length === 0) {
      nextGradeNote = '🟢 Вхід у Middle підтверджено: ' + readySignals.join(', ') + '. Далі — трек до Senior (див. ворота нижче).';
    } else if (mentorAvgNum >= 3.0 && (effectiveReady >= 2 && notReadySignals.length <= 1)) {
      nextGradeNote = '🟡 Middle-профіль загалом підтверджується. Сигнали: ' + readySignals.join(', ') + (notReadySignals.length ? '. Підтягнути: ' + notReadySignals.join(', ') : '') + '.';
    } else if (mentorAvgNum > 0 && mentorAvgNum < 2.5 || growthAreas.length >= 5) {
      nextGradeNote = '🔴 Поки не дотягує до входу в Middle — це радше Junior-профіль (виняток). Фокус: ' + (notReadySignals.length ? notReadySignals.join(', ') : weakAxes.join(', ')) + '. Розглянути продовження випробувального або посилений менторинг.';
    } else {
      nextGradeNote = '🟡 Змішана картина. Сигнали за: ' + (readySignals.join(', ')||'—') + '. Під питанням: ' + (notReadySignals.join(', ')||'—') + '.';
    }
  }

  let gradeText, gradeColor;
  if (mentorAvgNum >= 3.5) { gradeText = 'Грейд підтверджено з запасом'; gradeColor = 'var(--green)'; }
  else if (mentorAvgNum >= 2.8) { gradeText = 'Грейд підтверджено'; gradeColor = 'var(--green)'; }
  else if (mentorAvgNum >= 2.2) { gradeText = 'Грейд під питанням — є системні зони нижче очікувань'; gradeColor = 'var(--amber)'; }
  else { gradeText = 'Грейд не підтверджено'; gradeColor = 'var(--red)'; }

  const ipRes = Object.keys(IP_LABELS).map(c => ({
    label: IP_LABELS[c].q,
    selfB: data.self ? getVal(data.self, 'ipsative_' + c) === 'B' : null,
    mentorB: data._getIpsative ? data._getIpsative('mentor', 'ipsative_' + c) === 'B' : null
  }));
  const selfOpslabCount = ipRes.filter(r => r.selfB === true).length;
  const mentorOpslabCount = ipRes.filter(r => r.mentorB === true).length;

  const itemHtml = (s, color) => '<div class="interp-item"><span class="interp-dot" style="background:'+color+'"></span>'+s+'</div>';

  html += '<div class="section"><div class="section-header">Інтерпретація · Загальний висновок</div>';
  // Змістовний вердикт: підтверджується / просідає + приклади + PDP
  const dips = allScores.filter(s => s.mentor !== null && s.mentor <= 2.5).sort((a,b) => a.mentor - b.mentor);
  const topStrengths = allScores.filter(s => s.mentor >= 3.5).sort((a,b) => b.mentor - a.mentor).slice(0,4);

  let headline, hlColor;
  if (mentorAvgNum >= 3.5 && dips.length === 0) { headline = 'Middle-профіль підтверджено з запасом'; hlColor = 'var(--green)'; }
  else if (mentorAvgNum >= 2.8 && dips.length <= 2) { headline = 'Middle-профіль підтверджується' + (dips.length ? ', але просідає в окремих осях' : ''); hlColor = 'var(--green)'; }
  else if (mentorAvgNum >= 2.8) { headline = 'Middle-профіль підтверджується, але з кількома системними просіданнями'; hlColor = 'var(--amber)'; }
  else if (mentorAvgNum >= 2.2) { headline = 'Middle-профіль під питанням — просідає в ключових осях'; hlColor = 'var(--amber)'; }
  else { headline = 'Поки не дотягує до входу в Middle — радше Junior-профіль (виняток)'; hlColor = 'var(--red)'; }

  html += '<div class="verdict-box" style="border-left-color:'+hlColor+'">';
  html += '<div class="verdict-headline">'+headline+'</div>';
  html += '<div class="verdict-avg">Середня ментора <strong>'+mentorAvgNum.toFixed(1)+'</strong>/4 · самооцінка <strong>'+(avg('self')||'—')+'</strong> · peer <strong>'+(avg('peer')||'—')+'</strong></div>';
  if (topStrengths.length) {
    html += '<div class="verdict-sub" style="color:var(--green)">Тримає впевнено</div>';
    topStrengths.forEach(s => { html += '<div class="strong-row"><span class="strong-name">'+s.label+'</span><span class="strong-scores">ментор '+s.mentor+(s.self!==null?' · я '+s.self:'')+'</span></div>'; });
  }
  if (dips.length) {
    html += '<div class="verdict-sub" style="color:var(--amber)">Просідає — на що дивитись</div>';
    dips.forEach(s => {
      const egParts = [];
      if (s.self !== null && s.self - s.mentor >= 1) egParts.push('бачить себе вище за ментора (розрив '+(s.self-s.mentor).toFixed(1)+')');
      if (s.peer !== null && s.peer <= 2.5) egParts.push('peer теж нижче норми');
      const eg = egParts.length ? egParts.join('; ') : (CRITERIA_DESC[s.key] || '');
      html += '<div class="dip-row"><span class="dip-name">'+s.label+'</span><span class="dip-scores">ментор '+s.mentor+(s.self!==null?' · я '+s.self:'')+'</span><span class="dip-eg">'+eg+'</span></div>';
    });
  }
  html += (nextGradeNote ? '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--text);line-height:1.6">'+nextGradeNote+'</div>' : '');
  html += '</div>';

  // PDP-рекомендації
  const PDP_HOW = {
    'ведення_клієнта':'Вийти на автономний ритм з точковим Delivery — синки за розкладом, ревʼю тільки складних артефактів.',
    'мислення_екшн_планом':'Приходити на синк з гіпотезою наступного кроку; бачити звʼязки між етапами, не окремі кроки.',
    'управління_очікуваннями':'Жодного зсуву пріоритетів без явної домовленості; клієнт завжди знає що і коли.',
    'впровадження_змін':'Доводити кожне впровадження до контролю: тест → опір → фідбек.',
    'дія_в_невизначеності':'Звужувати до конкретного питання з власним варіантом; легалізувати невизначеність перед клієнтом.',
    'письмова_комунікація':'Впевнена письмова комунікація в нестандартних сценаріях, tone of voice.',
    'підготовка_дзвінка':'Кожен дзвінок — з адженди й гіпотез; завершувати підсумком домовленостей.',
    'презентація':'Готувати презентацію під психотип клієнта, продумувати контраргументи заздалегідь.',
    'робота_з_аудиторією':'Тренувати фасилітацію групи і роботу зі стейкхолдерами, не тільки з фаундером.',
    'валідація_запиту':'Перед виконанням — «навіщо» і «що зміниться»; альтернатива з аргументацією.',
    'ризики':'Зчитувати ризики на рівні реакції фаундера і системи бізнесу, не тільки плану.',
    'стійкість_під_тиском':'Пауза перед відповіддю під тиском; відповідати на запит, не на емоцію.',
    'людина_людина':'Свідомо будувати контакт, тримаючи межу з панібратством.',
    'робота_з_фідбеком':'Фідбек не повторюється двічі; самому приходити з рефлексією.',
    'внесок_opslab':'Принести команді інструмент/шаблон, що реально приживеться.',
    'робота_з_командою':'Партнерство в команді; за наявності — почати менторити молодшого.',
    'фінпоказники':'Привʼязати кожного клієнта до 2-3 вимірюваних метрик.',
    'інструменти':'Будувати системи з нуля впевнено; освоювати новий інструмент за кілька днів.',
    'автоматизації':'Розрізняти автоматизації в тулзах і Zapier/Make; ТЗ для інтегратора.',
    'ai':'Ввести AI у щоденну роботу; приносити команді нове.',
  };
  const pdpFocus = [];
  dips.slice(0,3).forEach(s => pdpFocus.push({ area: s.label, why: 'оцінка ментора '+s.mentor+'/4 — нижче впевненого входу', how: PDP_HOW[s.key] || null }));
  const blindspots = allScores.filter(s => s.self !== null && s.mentor !== null && s.self - s.mentor >= 1.5 && s.mentor > 2.5).sort((a,b)=>(b.self-b.mentor)-(a.self-a.mentor)).slice(0,1);
  blindspots.forEach(s => pdpFocus.push({ area: s.label + ' (сліпа зона)', why: 'самооцінка '+s.self+' проти '+s.mentor+' у ментора — звірити картину світу', how: 'На 1:1 розібрати ситуації, де сприйняття розійшлося; домовитись про спостережувані ознаки прогресу.' }));
  if (typeof ipRes !== 'undefined') {
    ipRes.forEach(r => { if (r.selfB === false && pdpFocus.length < 5) pdpFocus.push({ area: r.label + ' (OpsLab-підхід)', why: 'в ipsative обрано альтернативу, не OpsLab-логіку', how: 'Відпрацювати підхід на реальних кейсах з ментором, поки не стане рефлексом.' }); });
  }

  // Fallback: якщо явних просідань немає — беремо відносно найслабші осі (нижче середньої людини)
  if (pdpFocus.length === 0) {
    const scored = allScores.filter(s => s.mentor !== null);
    if (scored.length) {
      const personAvg = scored.reduce((a,b)=>a+b.mentor,0)/scored.length;
      const relWeak = scored.filter(s => s.mentor < personAvg).sort((a,b)=>a.mentor-b.mentor).slice(0,2);
      const pool = relWeak.length ? relWeak : scored.sort((a,b)=>a.mentor-b.mentor).slice(0,2);
      pool.forEach(s => pdpFocus.push({ area: s.label + ' (край росту)', why: 'найслабша серед сильних — тут найбільше запасу для наступного рівня', how: PDP_HOW[s.key] || null }));
    }
  }
  // Завжди додаємо погляд вперед: найближчі критерії воріт, яких ще бракує (рахуємо локально)
  if (pdpFocus.length < 5) {
    const fwd = [];
    const up = ctx ? parseFloat(getVal(ctx,'upsells')) : NaN;
    if (!isNaN(up) && up < 6) fwd.push({ area: 'До Senior: Upsells ≥ 6%', why: 'зараз '+up+'% — критерій наступних воріт', how: 'Знайти в поточних клієнтах потенціал розширення і запропонувати upsell з аргументацією.' });
    if (ctx && getVal(ctx,'case_study') !== 'Так') fwd.push({ area: 'До Senior: 2 case studies на клієнта', why: 'критерій воріт ще не закритий', how: 'Написати по 2 кейси на клієнта, що розкривають різні аспекти роботи.' });
    if (ctx && getVal(ctx,'mentoring') !== 'Так') fwd.push({ area: 'До Senior: менторство молодшого', why: 'критерій воріт ще не закритий', how: 'Взяти молодшого менеджера під менторство на проєкті.' });
    fwd.slice(0, 5 - pdpFocus.length).forEach(f => pdpFocus.push(f));
  }

  if (pdpFocus.length) {
    html += '<div class="pdp-box"><div class="pdp-title">На що звернути увагу при формуванні PDP / плану росту</div>';
    const lede = dips.length ? 'Пріоритети від найглибших просідань до сліпих зон самосприйняття. Основа для розмови, не автоматичний вердикт.'
                             : 'Явних просідань немає — нижче краї росту й погляд на найближчі ворота. Основа для розмови, не автоматичний вердикт.';
    html += '<div class="pdp-lede">'+lede+'</div>';
    pdpFocus.slice(0,5).forEach((f,i) => { html += '<div class="pdp-item"><span class="pdp-num">'+(i+1)+'</span><div><strong>'+f.area+'</strong> — <span class="why">'+f.why+'</span>'+(f.how?'<br>'+f.how:'')+'</div></div>'; });
    html += '</div>';
  }

  if (ctx) {
    html += '<div class="ctx-card" style="margin-bottom:14px"><div class="ctx-card-title">Контекстні показники</div>';
    html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px">';
    const clientsHtml = [1,2,3].map(i => {
      const c = getVal(ctx,'client_'+i); const l = getVal(ctx,'ltv_'+i);
      return c ? '<div><div style="font-size:11px;color:var(--muted)">Клієнт '+i+'</div><div style="font-size:13px;color:var(--text)">'+c+(l?' · '+l+' міс':'')+'</div></div>' : '';
    }).filter(Boolean).join('');
    html += clientsHtml + '</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px">';
    const badges = [
      getVal(ctx,'projects') ? getVal(ctx,'projects')+' проєктів' : null,
      getVal(ctx,'upsells') ? 'Upsells '+getVal(ctx,'upsells') : null,
      getVal(ctx,'case_study') && getVal(ctx,'case_study') !== '— не вибрано' ? 'Case study: '+getVal(ctx,'case_study') : null,
      getVal(ctx,'mentoring') && getVal(ctx,'mentoring') !== '— не вибрано' ? 'Менторство: '+getVal(ctx,'mentoring') : null,
      getVal(ctx,'notion') && getVal(ctx,'notion') !== '— не вибрано' ? 'Notion: '+getVal(ctx,'notion') : null,
      getVal(ctx,'clickup') && getVal(ctx,'clickup') !== '— не вибрано' ? 'ClickUp: '+getVal(ctx,'clickup') : null,
      getVal(ctx,'sheets') && getVal(ctx,'sheets') !== '— не вибрано' ? 'Sheets: '+getVal(ctx,'sheets') : null,
      getVal(ctx,'ai') && getVal(ctx,'ai') !== '— не вибрано' ? 'AI: '+getVal(ctx,'ai') : null,
      getVal(ctx,'context_speed') && getVal(ctx,'context_speed') !== '— не вибрано' ? 'Занурення: '+getVal(ctx,'context_speed') : null,
      getVal(ctx,'business_types') ? 'Бізнеси: '+getVal(ctx,'business_types') : null,
      getVal(ctx,'churn') && getVal(ctx,'churn') !== '— не вибрано' ? 'Churn: '+getVal(ctx,'churn') : null,
      getVal(ctx,'continuation') && getVal(ctx,'continuation') !== '— не вибрано' ? 'Продовження: '+getVal(ctx,'continuation') : null,
    ].filter(Boolean);
    html += badges.map(b => '<span style="font-size:11px;padding:3px 9px;border-radius:12px;background:var(--s2);border:1px solid var(--border2);color:var(--muted)">'+b+'</span>').join('');
    html += '</div>';
    const contrib = getVal(ctx,'opslab_contribution');
    if (contrib) html += '<div style="margin-top:10px;font-size:12px;color:var(--muted)"><span style="color:var(--purple);font-family:DM Mono,monospace;font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-right:6px">Внесок в OpsLab</span>'+contrib+'</div>';
    html += '</div>';
  }

  html += '<div class="interp-grid">';
  if (strengths.length) html += '<div class="interp-card"><div class="interp-card-title" style="color:var(--green)">Сильні сторони · ментор ≥ 3.5</div>' + strengths.map(s=>itemHtml(s.label,'var(--green)')).join('') + '</div>';
  if (growthAreas.length) html += '<div class="interp-card"><div class="interp-card-title" style="color:var(--amber)">Зони росту · ментор ≤ 2</div>' + growthAreas.map(s=>itemHtml(s.label,'var(--amber)')).join('') + '</div>';
  if (matches.length) html += '<div class="interp-card"><div class="interp-card-title" style="color:var(--blue)">Збіг в оцінці</div><div class="interp-sub">Самооцінка і ментор бачать однаково</div>' + matches.map(s=>itemHtml(s.label+' ('+s.self+' / '+s.mentor+')','var(--blue)')).join('') + '</div>';
  if (gaps.length) html += '<div class="interp-card"><div class="interp-card-title" style="color:var(--red)">Розриви в оцінці</div><div class="interp-sub">Варто обговорити на фінальній зустрічі</div>' + gaps.map(s=>itemHtml(s.label+' — я: '+s.self+', ментор: '+s.mentor,'var(--red)')).join('') + '</div>';
  html += '</div>';

  html += '<div class="interp-opslab">' +
    '<div class="interp-card-title" style="color:var(--purple)">OpsLab-підхід на рівні мислення</div>' +
    '<div class="interp-sub" style="margin-bottom:12px">Скільки разів обрано OpsLab-підхід (варіант Б) з 4 ipsative питань</div>' +
    '<div style="display:flex;gap:28px">' +
    '<div><span style="color:var(--green);font-size:28px;font-weight:300">'+selfOpslabCount+'/'+ipRes.length+'</span><div style="font-size:11px;color:var(--muted);margin-top:3px">Самооцінка</div></div>' +
    '<div><span style="color:var(--amber);font-size:28px;font-weight:300">'+mentorOpslabCount+'/'+ipRes.length+'</span><div style="font-size:11px;color:var(--muted);margin-top:3px">Ментор бачить</div></div>' +
    '</div></div>';
  html += '</div>';


  // === GRADE TRANSITION LOGIC (from real grading doc) ===
  const GRADE_TRANSITIONS = {
    'junior': {
      next: 'Middle Fractional OM (підтвердження входу)',
      entry: true,
      score_expectation: 3.0,
      criteria: [
        { key: 'no_fault_churn', label: 'Немає churn з вини менеджера', check: (ctx) => ctx && getVal(ctx,'churn') === 'Не було', critical:true },
        { key: 'continuation', label: 'Клієнти продовжуються', check: (ctx) => ctx && ['Всі продовжуються','Більшість'].includes(getVal(ctx,'continuation')) },
        { key: 'autonomy', label: 'Веде клієнта без щоденного супроводу Delivery', check: () => null },
        { key: 'change_control', label: 'Доводить впровадження до контролю, не кидає на презентації', check: () => null },
        { key: 'complexity', label: 'Тримає складність рівня входу (охоплення / стейкхолдери / к-ть людей)', check: () => null },
      ]
    },
    'middle': {
      next: 'Senior Fractional OM',
      tenure_months: 6,
      score_expectation: 3.5,
      criteria: [
        { key: 'tenure', label: 'Мінімум 6 місяців на рівні', check: () => null },
        { key: 'complexity', label: 'Веде мінімум 1 складного клієнта І освоїв нові бізнес-моделі', check: () => null, critical:true },
        { key: 'ltv', label: 'LTV ≥ 10 місяців', check: (ctx, avgLtv) => avgLtv >= 10 },
        { key: 'no_fault_churn', label: 'Немає churn з вини менеджера', check: (ctx) => ctx && getVal(ctx,'churn') === 'Не було', critical:true },
        { key: 'upsells', label: 'Upsells ≥ 6%', check: (ctx) => ctx && parseFloat(getVal(ctx,'upsells')) >= 6 },
        { key: 'biz_models', label: 'Бізнес-моделі: 5+ у досвіді', check: (ctx) => { const v=ctx&&getVal(ctx,'business_types'); if(!v) return null; const n=v.split(',').filter(x=>x.trim()).length; return n>=5; } },
        { key: 'case_study', label: 'Мінімум 2 case studies на кожного клієнта', check: (ctx) => ctx && getVal(ctx,'case_study') === 'Так' },
        { key: 'mentoring', label: 'Менторить молодшого менеджера', check: (ctx) => ctx && getVal(ctx,'mentoring') === 'Так' },
        { key: 'fin_metrics', label: 'Прив’язує клієнта до кількісних показників', check: () => null },
      ]
    },
    'senior': {
      next: 'Junior Fractional COO',
      tenure_months: 6,
      score_expectation: 4.0,
      criteria: [
        { key: 'tenure', label: 'Мінімум 6 місяців на рівні', check: () => null },
        { key: 'complexity', label: 'Веде складних клієнтів системно, не епізодично', check: () => null, critical:true },
        { key: 'ltv_portfolio', label: 'LTV портфелю ≥ 12 місяців', check: (ctx, avgLtv) => avgLtv >= 12 },
        { key: 'no_fault_churn', label: 'Churn з вини менеджера — неприйнятний', check: (ctx) => ctx && getVal(ctx,'churn') === 'Не було', critical:true },
        { key: 'upsells', label: 'Upsells ≥ 10%', check: (ctx) => ctx && parseFloat(getVal(ctx,'upsells')) >= 10 },
        { key: 'biz_models', label: 'Бізнес-моделі: 7+ у досвіді', check: (ctx) => { const v=ctx&&getVal(ctx,'business_types'); if(!v) return null; const n=v.split(',').filter(x=>x.trim()).length; return n>=7; } },
        { key: 'case_study', label: 'Мінімум 2 case studies на кожного клієнта', check: (ctx) => ctx && getVal(ctx,'case_study') === 'Так' },
        { key: 'ltv_resp', label: 'Відповідає за LTV портфелю, не окремих клієнтів', check: () => null },
      ]
    }
  };

  const gradeLower = (role || '').toLowerCase();
  const gradeKey = gradeLower.includes('junior') ? 'junior' : gradeLower.includes('middle') ? 'middle' : gradeLower.includes('senior') ? 'senior' : null;
  const transition = gradeKey ? GRADE_TRANSITIONS[gradeKey] : null;

  // Check each criterion
  const passedCriteria = [];
  const failedCriteria = [];
  const notEnoughData = [];

  if (transition) {
    transition.criteria.forEach(c => {
      const result = c.check(ctx, avgLtvNum);
      const isFail = c.fail ? c.fail(ctx, avgLtvNum) : false;
      if (result === true) passedCriteria.push(c.label);
      else if (isFail) failedCriteria.push({ label: c.label, critical: true });
      else if (result === false && ctx) failedCriteria.push({ label: c.label, critical: false });
      else notEnoughData.push(c.label);
    });
  }

  // Score gaps as development areas with specific descriptions
  const SCORE_DEVELOPMENT = {
    'ведення_клієнта': { goal:'Взяти клієнта у самостійне ведення з мінімальним Delivery: синки за розкладом, ревʼю тільки складних артефактів. Ціль — ритм, де ескалації рідкісні й по суті.' },
    'мислення_екшн_планом': { goal:'Оновлювати екшн-план щотижня самостійно і приходити на синк з гіпотезою наступного кроку, а не з питанням. До кінця періоду — бачити звʼязки між етапами, не окремі кроки.' },
    'управління_очікуваннями': { goal:'Формувати рамку так, щоб клієнт завжди знав що і коли. Жодного зсуву пріоритетів без явної домовленості і фіксації в плані — навіть під тиском.' },
    'впровадження_змін': { goal:'Кожне впровадження доводити до контролю за фреймворком: тест, робота з опором, фідбек. Ціль — жоден процес не лишився на етапі «розказав на дзвінку».' },
    'дія_в_невизначеності': { goal:'У ситуації незнання не завмирати: звузити до конкретного питання з власним варіантом, поставити строк на прояснення. Легалізувати невизначеність перед клієнтом.' },
    'письмова_комунікація': { goal:'Планфакт стабільно, у tone of voice клієнта. Навчитись впевнено писати в нестандартних сценаріях, а не тільки у відпрацьованих.' },
    'підготовка_дзвінка': { goal:'Кожен дзвінок — з адженди й гіпотез, не з чистого аркуша. Тримати структуру і завершувати підсумком домовленостей.' },
    'презентація': { goal:'Готувати презентацію під психотип клієнта: подача, таймінг, продумані заздалегідь контраргументи. Захищати результат, а не просто показувати.' },
    'робота_з_аудиторією': { goal:'Від впевненого 1:1 — до фасилітації групи: давати слово, збирати позиції, заелайнювати стейкхолдерів навколо рішення.' },
    'валідація_запиту': { goal:'Перед виконанням запиту — «навіщо» і «що зміниться». Пропонувати альтернативу з аргументацією й оцінкою доцільності (час/гроші), брати за неї відповідальність.' },
    'ризики': { goal:'Зчитувати ризики не тільки на рівні плану, а й «як сприйме фаундер». Повідомляти до того, як стало критично, зі своїм варіантом рішення.' },
    'стійкість_під_тиском': { goal:'Під тиском — «я подумаю і повернусь» замість реакції одразу. Залишатись конгруентним: що відчуваєш і як проявляєшся — співпадає.' },
    'людина_людина': { goal:'Свідомо будувати контакт, тримаючи межу з панібратством. Ціль — клієнт починає приносити те, про що не питали.' },
    'робота_з_фідбеком': { goal:'Фідбек не повторюється двічі — зміна поведінки помітна вже наступного тижня. Почати самому приходити з рефлексією, не чекаючи ментора.' },
    'внесок_opslab': { goal:'Принести команді один інструмент/шаблон/підхід, що реально приживеться. Оформити його для перевикористання.' },
    'робота_з_командою': { goal:'Працювати в команді як партнер: ділитись контекстом, підхоплювати й передавати без втрати якості. За наявності — почати менторити молодшого.' },
    'фінпоказники': { goal:'Привʼязати кожного свого клієнта до 2-3 вимірюваних показників і вести їх — щоб було видно вплив роботи, а не тільки закриті задачі.' },
    'інструменти': { goal:'Вийти на впевнене будування систем з нуля в Notion/ClickUp/Sheets + одна CRM. Освоювати новий інструмент самостійно за кілька днів.' },
    'автоматизації': { goal:'Розрізняти автоматизації всередині тулзів і Zapier/Make, прописувати ТЗ для інтегратора. Спершу контроль процесу — потім автоматизація.' },
    'ai': { goal:'Ввести AI у щоденну роботу і раз на період приносити команді інструмент/підхід, що реально спрацював.' },
  }

  // Generate 90-day goals
  const goals90 = [];

  // Goals from score gaps (mentor <= 2)
  growthAreas.forEach(s => {
    const dev = SCORE_DEVELOPMENT[s.key];
    if (dev) goals90.push({ source: 'gap', label: s.label, goal: dev.goal });
  });

  // Goals from ipsative gaps
  ipRes.forEach(r => {
    if (!r.selfB && r.mentorB === true) {
      const ipsGoals = {
        'Валідація запиту': 'Практикувати питання "навіщо" і "що змінюється" перед кожним виконанням запиту — не після.',
        'Стійкість під тиском': 'Тренувати паузу перед відповіддю під тиском. Відповідати на запит а не на емоцію.',
        'Відповідальність': 'Після кожної ситуації що пішла не так — писати 2-3 речення про свою частину перед тим як ескалювати.',
        'Відвертість у стосунках': 'Знайти одну незручну річ на поточному проєкті і підсвітити її клієнту протягом місяця.',
      };
      if (ipsGoals[r.label]) goals90.push({ source: 'ipsative', label: r.label, goal: ipsGoals[r.label] });
    }
  });

  // Goals from grade transition gaps
  if (transition) {
    failedCriteria.forEach(f => {
      const transGoals = {
        'LTV ≥ 10 місяців': 'Фокус на утриманні — жодного churn з власної провини. Щомісячний check-in про задоволеність клієнта.',
        'LTV портфелю ≥ 12 місяців': 'Тримати ретеншн по всьому портфелю: рання ескалація ризиків, системний check-in по кожному клієнту.',
        'Upsells ≥ 6%': 'Знайти в поточних клієнтах потенціал розширення і запропонувати конкретний upsell з аргументацією протягом кварталу.',
        'Upsells ≥ 10%': 'Вибудувати upsell як системну практику по портфелю, не разові пропозиції.',
        'Веде мінімум 1 складного клієнта І освоїв нові бізнес-моделі': 'Взяти складнішого клієнта (за охопленням/стейкхолдерами/к-тю людей під змінами) і зайти в нову для себе бізнес-модель.',
        'Веде складних клієнтів системно, не епізодично': 'Перейти від «іноді складний проєкт» до стабільного портфелю складних клієнтів.',
        'Мінімум 2 case studies на кожного клієнта': 'Написати по 2 case studies на клієнта, що розкривають різні аспекти роботи — не одна ретроспектива.',
        'Менторить молодшого менеджера': 'Взяти молодшого під менторство: ставити задачі, приймати роботу, давати фідбек без участі Delivery.',
        'Немає churn з вини менеджера': 'Глибокий аналіз кожного churn з власником і CEO — що конкретно можна було інакше. Зафіксувати письмово як урок.',
        'Churn з вини менеджера — неприйнятний': 'На рівні Senior→COO churn з власної провини — стоп-фактор. Пріоритет №1 — ретеншн портфелю.',
        'Прив’язує клієнта до кількісних показників': 'Привʼязати кожного клієнта до 2-3 вимірюваних метрик і вести їх регулярно.',
        'Мінімум 6 місяців на рівні': 'Витримати мінімум 6 місяців стабільної роботи на рівні перед розглядом переходу.',
        'Бізнес-моделі: 5+ у досвіді': 'Розширити портфель бізнес-моделей — свідомо брати проєкти в незнайомих індустріях.',
        'Бізнес-моделі: 7+ у досвіді': 'Довести досвід до 7+ бізнес-моделей, включно зі складними (виробництво, дистрибуція, мультиюніт).',
      }
      if (transGoals[f.label]) goals90.push({ source: 'transition', label: f.label, goal: transGoals[f.label], critical: f.critical });
    });
  }

  // Render development + goals block
  if (transition || growthAreas.length > 0) {
    html += '<div class="section"><div class="section-header">Розвиток · Зони і цілі на 3 місяці</div>';

    // Grade transition checklist
    if (transition && (passedCriteria.length + failedCriteria.length + notEnoughData.length > 0)) {
      html += '<div class="dev-transition"><div class="dev-transition-title">Що потрібно для переходу на ' + transition.next + '</div>';
      html += '<div class="dev-criteria">';
      passedCriteria.forEach(l => {
        html += '<div class="dev-criterion passed"><span class="dev-icon">✓</span>' + l + '</div>';
      });
      failedCriteria.forEach(f => {
        html += '<div class="dev-criterion ' + (f.critical ? 'critical' : 'failed') + '"><span class="dev-icon">' + (f.critical ? '✗' : '○') + '</span>' + f.label + '</div>';
      });
      notEnoughData.forEach(l => {
        html += '<div class="dev-criterion no-data"><span class="dev-icon">—</span>' + l + ' <span class="dev-na">немає даних</span></div>';
      });
      html += '</div></div>';
    }

    // 90-day goals
    if (goals90.length > 0) {
      html += '<div class="dev-goals-title">Цілі на наступні 3 місяці</div>';
      const sourceLabels = { gap: 'Зона росту', ipsative: 'Підхід', transition: 'До переходу' };
      const sourceColors = { gap: 'var(--amber)', ipsative: 'var(--purple)', transition: 'var(--blue)' };
      goals90.forEach((g, i) => {
        html += '<div class="dev-goal' + (g.critical ? ' dev-goal-critical' : '') + '">' +
          '<div class="dev-goal-header">' +
          '<span class="dev-goal-num">' + (i+1) + '</span>' +
          '<span class="dev-goal-source" style="color:' + sourceColors[g.source] + '">' + sourceLabels[g.source] + ' · ' + g.label + '</span>' +
          '</div>' +
          '<div class="dev-goal-text">' + g.goal + '</div>' +
          '</div>';
      });
    }

    html += '</div>';
  }


    // === COMMENT FIELD ===
  const mgNameForComment = name;
  html += '<div class="section"><div class="section-header">Коментар після фінальної розмови</div>' +
    '<div class="comment-intro">Заповни після того як обговорили звіт. Відправляється окремо в таблицю.</div>' +
    '<textarea class="mentor-comment" id="mentor-comment" placeholder="Фінальний коментар, домовленості, наступні кроки..."></textarea>' +
    '<button class="comment-btn" onclick="submitComment(\''+mgNameForComment+'\')">Зберегти коментар</button>' +
    '<div class="comment-status" id="comment-status"></div>' +
    '</div>';


      const reportEl = document.getElementById('report');
  reportEl.innerHTML = html;
  reportEl.style.display = 'block';
  reportEl.scrollIntoView({ behavior: 'smooth' });
}

async function saveContextData(managerName) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Зберігаємо...';

  const payload = {
    timestamp: new Date().toISOString(),
    evaluator_role: 'context_data',
    evaluator_name: 'Ментор',
    manager_name: managerName,
    client_1: document.getElementById('ctx_client_1')?.value || '',
    ltv_1: document.getElementById('ctx_ltv_1')?.value || '',
    client_2: document.getElementById('ctx_client_2')?.value || '',
    ltv_2: document.getElementById('ctx_ltv_2')?.value || '',
    client_3: document.getElementById('ctx_client_3')?.value || '',
    ltv_3: document.getElementById('ctx_ltv_3')?.value || '',
    upsells: document.getElementById('ctx_upsells')?.value || '',
    projects: document.getElementById('ctx_projects')?.value || '',
    case_study: document.getElementById('ctx_case_study')?.value || '',
    mentoring: document.getElementById('ctx_mentoring')?.value || '',
    notion: document.getElementById('ctx_notion')?.value || '',
    clickup: document.getElementById('ctx_clickup')?.value || '',
    sheets: document.getElementById('ctx_sheets')?.value || '',
    ai: document.getElementById('ctx_ai')?.value || '',
    business_types: document.getElementById('ctx_business_types')?.value || '',
    context_speed: document.getElementById('ctx_context_speed')?.value || '',
    opslab_contribution: document.getElementById('ctx_opslab_contribution')?.value || '',
    churn: document.getElementById('ctx_churn')?.value || '',
    continuation: document.getElementById('ctx_continuation')?.value || '',
  };

  try {
    await fetch('https://hooks.zapier.com/hooks/catch/14002247/4bh0i7c/', {
      method: 'POST', mode: 'no-cors', body: JSON.stringify(payload)
    });
    const st = document.getElementById('ctx-status');
    st.textContent = '✓ Збережено — наступного разу підтягнеться автоматично';
    st.style.color = 'var(--green)';
    btn.textContent = 'Зберегти контекстні дані';
    btn.disabled = false;
  } catch(e) {
    document.getElementById('ctx-status').textContent = 'Помилка. Спробуй ще раз.';
    btn.disabled = false;
    btn.textContent = 'Зберегти контекстні дані';
  }
}

async function submitComment(managerName) {
  const comment = document.getElementById('mentor-comment').value.trim();
  if (!comment) { alert('Введи коментар перш ніж зберегти'); return; }
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Зберігаємо...';
  try {
    await fetch('https://hooks.zapier.com/hooks/catch/14002247/4bh0i7c/', {
      method: 'POST', mode: 'no-cors',
      body: JSON.stringify({
        timestamp: new Date().toISOString(),
        evaluator_role: 'final_comment',
        evaluator_name: 'Ментор',
        manager_name: managerName,
        open_1: comment
      })
    });
    document.getElementById('comment-status').textContent = '✓ Коментар збережено';
    document.getElementById('comment-status').style.color = 'var(--green)';
  } catch(e) {
    document.getElementById('comment-status').textContent = 'Помилка. Спробуй ще раз.';
    document.getElementById('comment-status').style.color = 'var(--red)';
    btn.disabled = false;
    btn.textContent = 'Зберегти коментар';
  }
}

document.getElementById('manager-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadReport();
});

async function loadAvailable() {
  try {
    const res = await fetch(SHEET_URL + '&sheet=Sheet1');
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const rows = json.table.rows;
    const cols = json.table.cols.map(c => c.label.trim());

    const getVal = (row, colName) => {
      let idx = cols.findIndex(c => c.trim() === colName.trim());
      if (idx < 0 && colName === 'manager_name') {
        idx = cols.findIndex(c => c.trim().startsWith('manager_nam'));
      }
      if (idx < 0) return null;
      const cell = row.c[idx];
      return cell && cell.v !== null ? String(cell.v).trim() : null;
    };

    // Збираємо унікальних менеджерів і які ролі вже заповнили
    const managers = {};
    rows.forEach(row => {
      if (!row.c || row.c.every(cell => !cell || cell.v === null)) return;
      const mn = getVal(row, 'manager_name');
      const role = getVal(row, 'evaluator_role');
      if (!mn) return;
      if (!managers[mn]) managers[mn] = { self: false, mentor: false, peer: false };
      if (role) managers[mn][role] = true;
    });

    if (Object.keys(managers).length === 0) return;

    const list = document.getElementById('available-list');
    list.innerHTML = '';

    Object.entries(managers).forEach(([name, roles]) => {
      const total = [roles.self, roles.mentor, roles.peer].filter(Boolean).length;
      const card = document.createElement('div');
      card.style.cssText = 'background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:10px 14px;cursor:pointer;transition:border-color .15s;';
      card.onmouseenter = () => card.style.borderColor = 'var(--blue-b)';
      card.onmouseleave = () => card.style.borderColor = 'var(--border2)';
      card.onclick = () => {
        document.getElementById('manager-input').value = name;
        loadReport();
      };

      const dots = [
        { role: 'self', color: 'var(--green)', label: 'С' },
        { role: 'mentor', color: 'var(--amber)', label: 'М' },
        { role: 'peer', color: 'var(--teal)', label: 'P' },
      ].map(d => `<span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:${roles[d.role] ? d.color : 'var(--s3)'};font-family:'DM Mono',monospace;font-size:8px;font-weight:500;color:${roles[d.role] ? 'var(--bg)' : 'var(--hint)'};">${d.label}</span>`).join('');

      card.innerHTML = `
        <div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px;">${name}</div>
        <div style="display:flex;align-items:center;gap:4px;">${dots}<span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-left:4px;">${total}/3</span></div>
      `;
      list.appendChild(card);
    });

    document.getElementById('available-block').style.display = 'block';
  } catch(e) {
    console.log('Could not load available reports', e);
  }
}

loadAvailable();
