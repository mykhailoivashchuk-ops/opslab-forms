<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpsLab · Gap Analysis · Випробувальний</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D0F12;
  --surface: #141720;
  --s2: #1C2030;
  --s3: #222840;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #F0F2F7;
  --muted: #7A8099;
  --hint: #4A5068;
  --blue: #4E8FE8;
  --blue-bg: rgba(78,143,232,0.12);
  --blue-b: rgba(78,143,232,0.3);
  --green: #4EAD7A;
  --green-bg: rgba(78,173,122,0.12);
  --green-b: rgba(78,173,122,0.3);
  --amber: #D4933A;
  --amber-bg: rgba(212,147,58,0.12);
  --amber-b: rgba(212,147,58,0.3);
  --red: #C95F5F;
  --red-bg: rgba(201,95,95,0.12);
  --red-b: rgba(201,95,95,0.3);
  --purple: #9B7DE8;
  --purple-bg: rgba(155,125,232,0.12);
  --purple-b: rgba(155,125,232,0.3);
  --teal: #4EA8AD;
  --teal-bg: rgba(78,168,173,0.12);
  --teal-b: rgba(78,168,173,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
.page { max-width: 1100px; margin: 0 auto; padding: 40px 32px 80px; }

/* Header */
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
.logo-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--blue-bg); border: 1px solid var(--blue-b); display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--blue); }
.logo-text { font-size: 13px; color: var(--muted); }

/* Search */
.search-block { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; padding: 20px; margin-bottom: 32px; }
.search-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 12px; }
.search-row { display: flex; gap: 10px; }
.search-input { flex: 1; background: var(--s2); border: 1px solid var(--border2); border-radius: 8px; padding: 9px 12px; font-size: 13px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; }
.search-input:focus { border-color: var(--blue-b); }
.search-input::placeholder { color: var(--hint); }
.search-btn { padding: 9px 20px; background: var(--blue-bg); border: 1px solid var(--blue-b); border-radius: 8px; color: var(--blue); font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; }
.search-btn:hover { background: rgba(78,143,232,0.2); }
.search-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.search-status { font-size: 12px; color: var(--muted); margin-top: 8px; }

/* Report */
#report { display: none; }

.report-header { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
.report-name { font-size: 26px; font-weight: 300; letter-spacing: -.01em; margin-bottom: 6px; }
.report-name strong { font-weight: 500; }
.report-meta { font-size: 13px; color: var(--muted); }

/* Summary cards */
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 32px; }
.summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.summary-card.empty { opacity: 0.4; }
.sc-role { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.sc-role.self { color: var(--green); }
.sc-role.mentor { color: var(--amber); }
.sc-role.peer { color: var(--teal); }
.sc-avg { font-size: 32px; font-weight: 300; letter-spacing: -.02em; }
.sc-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Section */
.section { margin-bottom: 28px; }
.section-header { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; color: var(--hint); letter-spacing: .06em; text-transform: uppercase; padding: 7px 0 12px; border-top: 1px solid var(--border); margin-bottom: 12px; }

/* Gap bars */
.criteria-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.criterion-row { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.cr-label { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
.bars { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.bar-row { display: flex; align-items: center; gap: 12px; }
.bar-role { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); width: 80px; flex-shrink: 0; }
.bar-track { flex: 1; height: 10px; background: var(--s2); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 5px; transition: width .7s cubic-bezier(.4,0,.2,1); }
.bar-fill.self { background: var(--green); }
.bar-fill.mentor { background: var(--amber); }
.bar-fill.peer { background: var(--teal); }
.bar-val { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--text); width: 20px; text-align: right; flex-shrink: 0; }
.gap-badge { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; padding: 2px 7px; border-radius: 10px; margin-left: 8px; }
.gap-ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-b); }
.gap-warn { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-b); }
.gap-crit { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-b); }

/* Ipsative */
.ip-block { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 10px; }
.ip-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
.ip-criterion { font-size: 15px; font-weight: 500; color: var(--text); }
.ip-choices { display: flex; gap: 8px; flex-shrink: 0; }
.ip-choice-pill { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 1px solid var(--border2); }
.ip-choice-pill.opslab { background: var(--green-bg); color: var(--green); border-color: var(--green-b); }
.ip-choice-pill.alt { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-b); }
.ip-choice-pill.match { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-b); }
.ip-pill-role { font-family: 'DM Mono', monospace; font-size: 9px; opacity: 0.7; }
.ip-example { background: var(--s2); border-radius: 8px; padding: 12px 14px; }
.ip-example-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--hint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.ip-example-self { font-size: 13px; color: var(--text); line-height: 1.6; margin-bottom: 8px; }
.ip-example-mentor { font-size: 13px; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--border); padding-top: 8px; }
.ip-role-tag { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }

/* Trust */
.trust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.trust-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-align: center; }
.trust-role { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.trust-score { font-size: 36px; font-weight: 300; letter-spacing: -.02em; margin-bottom: 4px; }
.trust-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }

/* Redflags */
.redflag-list { background: var(--red-bg); border: 1px solid var(--red-b); border-radius: 12px; padding: 14px 16px; }
.rf-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.rf-item:last-child { margin-bottom: 0; }
.rf-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; margin-top: 5px; }
.no-flags { font-size: 12px; color: var(--green); }

/* Open questions */
.open-block { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 7px; }
.open-role { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; color: var(--hint); }
.open-q { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
.open-a { font-size: 13px; color: var(--text); line-height: 1.65; }

/* Decision */
.decision-block { background: var(--green-bg); border: 1px solid var(--green-b); border-radius: 12px; padding: 16px 18px; }
.decision-label { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--green); margin-bottom: 8px; }
.decision-text { font-size: 14px; color: var(--text); line-height: 1.65; }

.legend-block { background: var(--s2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.legend-title { font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .04em; font-family: 'DM Mono', monospace; }
.legend-grid { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.legend-scale { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.legend-scale-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.scale-badge { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; color: var(--text); background: var(--s3); padding: 1px 6px; border-radius: 4px; }
.legend-gaps { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.cr-desc { font-size: 11px; color: var(--hint); margin-bottom: 10px; line-height: 1.5; font-style: italic; }
.discussion-intro { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
.discussion-q { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 7px; }
.dq-type { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
.dq-text { font-size: 13px; color: var(--text); line-height: 1.65; }
.open-intro { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
/* Ipsative improvements */
.ip-q-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; line-height: 1.5; }
.ip-variants { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 8px; }
.ip-variant { padding: 10px 12px; border-radius: 8px; background: var(--s2); border: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; align-items: flex-start; gap: 8px; }
.ip-variant.highlighted-a { border-color: var(--amber-b); }
.ip-variant.highlighted-b { border-color: var(--green-b); color: var(--text); }
.ip-v-label { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; color: var(--hint); flex-shrink: 0; margin-top: 1px; }
.ip-opslab-note { font-size: 11px; color: var(--purple); background: var(--purple-bg); border: 1px solid var(--purple-b); border-radius: 6px; padding: 5px 10px; margin-bottom: 10px; }
/* Interpretation */
.interp-grade { border: 1px solid; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.interp-grade-label { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
.interp-grade-text { font-size: 16px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.interp-grade-avg { font-size: 13px; color: var(--muted); }
.interp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.interp-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.interp-card-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.interp-sub { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.interp-item { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 5px; line-height: 1.4; }
.interp-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.interp-opslab { background: var(--purple-bg); border: 1px solid var(--purple-b); border-radius: 12px; padding: 14px 16px; }
/* Comment */
.comment-intro { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.6; }
.mentor-comment { width: 100%; background: var(--s2); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text); font-family: 'DM Sans', sans-serif; resize: vertical; min-height: 100px; outline: none; line-height: 1.6; margin-bottom: 10px; }
.mentor-comment:focus { border-color: var(--blue-b); }
.comment-btn { padding: 9px 20px; background: var(--blue-bg); border: 1px solid var(--blue-b); border-radius: 8px; color: var(--blue); font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.comment-btn:hover { background: rgba(78,143,232,0.2); }
.comment-btn:disabled { opacity: .4; cursor: not-allowed; }
.comment-status { font-size: 12px; margin-top: 8px; }
.open-compare-block { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 8px; }
.ocb-q { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 14px; }
.ocb-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.ocb-col { background: var(--s2); border-radius: 8px; padding: 12px 14px; }
.ocb-role { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.ocb-text { font-size: 13px; color: var(--text); line-height: 1.65; }
</style>
</head>

async function loadReport() {
  const name = document.getElementById('manager-input').value.trim();
  if (!name) { setStatus('Введи імʼя менеджера'); return; }

  const btn = document.getElementById('search-btn');
  btn.disabled = true;
  setStatus('Завантажуємо дані...');

  try {
    const res = await fetch(SHEET_URL + '&sheet=Sheet1');
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const rows = json.table.rows;
    const cols = json.table.cols.map(c => c.label.trim());

    const getVal = (row, colName) => {
      let idx = cols.findIndex(c => c.trim() === colName.trim());
      if (idx < 0 && colName === 'manager_name') {
        idx = cols.findIndex(c => c.trim().startsWith('manager_nam'));
      }
      if (idx < 0) return null;
      const cell = row.c[idx];
      return cell && cell.v !== null ? String(cell.v).trim() : null;
    };

    const managerRows = rows.filter(row => {
      if (!row.c || row.c.every(cell => !cell || cell.v === null)) return false;
      const mn = getVal(row, 'manager_name');
      return mn && mn.toLowerCase().includes(name.toLowerCase());
    });

    if (managerRows.length === 0) {
      setStatus(`Не знайдено даних для "${name}". Перевір імʼя.`);
      btn.disabled = false;
      return;
    }

    const data = { self: null, mentor: null, peer: null, mentors: [], peers: [] };
    managerRows.forEach(row => {
      const role = getVal(row, 'evaluator_role');
      if (role === 'self') data.self = row;
      else if (role === 'mentor') { data.mentors.push(row); data.mentor = row; }
      else if (role === 'peer') { data.peers.push(row); data.peer = row; }
    });

    // Усереднюємо менторів і peer якщо їх кілька
    const avgRows = (rows, col) => {
      const vals = rows.map(r => getVal(r, col)).filter(v => v && !isNaN(parseFloat(v))).map(v => parseFloat(v));
      return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : null;
    };

    // Створюємо агреговані рядки для ментора і peer
    if (data.mentors.length > 1) {
      data._mentorAvg = true;
      data._mentorCount = data.mentors.length;
    }
    if (data.peers.length > 1) {
      data._peerAvg = true;
      data._peerCount = data.peers.length;
    }

    // Функція для отримання усередненого значення
    data._getAvgVal = (role, col) => {
      if (role === 'self') return data.self ? getVal(data.self, col) : null;
      const rows = role === 'mentor' ? data.mentors : role === 'peer' ? data.peers : [];
      if (rows.length === 0) return null;
      if (rows.length === 1) return getVal(rows[0], col);
      return avgRows(rows, col);
    };

    // Ipsative — більшість голосів
    data._getIpsative = (role, col) => {
      const rows = role === 'mentor' ? data.mentors : role === 'peer' ? data.peers : [];
      if (rows.length === 0) return null;
      if (rows.length === 1) return getVal(rows[0], col);
      const votes = {};
      rows.forEach(r => { const v = getVal(r, col); if (v) votes[v] = (votes[v]||0)+1; });
      return Object.keys(votes).sort((a,b)=>votes[b]-votes[a])[0] || null;
    };

    const managerName = getVal(managerRows[0], 'manager_name');
    const managerRole = data.self ? getVal(data.self, 'manager_role') : '';

    setStatus(`Знайдено: ${managerRows.length} відповід${managerRows.length === 1 ? 'ь' : 'і'}`);
    renderReport(managerName, managerRole, data, cols, getVal);
  } catch(e) {
    setStatus('Помилка завантаження. Перевір доступ до таблиці.');
    console.error(e);
  }
  btn.disabled = false;
}

function renderReport(name, role, data, cols, getVal) {
  const scores = { self: {}, mentor: {}, peer: {} };
  // ініціалізуємо всі критерії як null
  ['self','mentor','peer'].forEach(r => {
    CRITERIA_12.forEach(c => { scores[r][c] = null; });
  });

  ['self','mentor','peer'].forEach(r => {
    const rows = r === 'mentor' ? data.mentors : r === 'peer' ? data.peers : data.self ? [data.self] : [];
    if (rows.length === 0) return;
    CRITERIA_12.forEach(c => {
      const val = data._getAvgVal ? data._getAvgVal(r, `scores_${c}`) : getVal(rows[0], `scores_${c}`);
      scores[r][c] = (val !== null && val !== undefined && val !== '' && !isNaN(parseFloat(val))) ? parseFloat(val) : null;
    });
  });

  const avg = r => {
    const rows = r === 'mentor' ? data.mentors : r === 'peer' ? data.peers : data.self ? [data.self] : [];
    if (rows.length === 0) return null;
    const vals = CRITERIA_12.map(c => scores[r][c]).filter(v => v !== null);
    return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : null;
  };

  const gap = (a, b) => {
    if (a === null || b === null) return null;
    return Math.abs(a - b);
  };

  const gapBadge = (selfVal, mentorVal) => {
    const g = gap(selfVal, mentorVal);
    if (g === null) return '';
    if (g <= 0.5) return '<span class="gap-badge gap-ok">Збіг</span>';
    if (g <= 1) return '<span class="gap-badge gap-warn">±' + g.toFixed(1) + '</span>';
    return '<span class="gap-badge gap-crit">Розрив ' + g.toFixed(1) + '</span>';
  };

  const barPct = v => v ? ((v/4)*100).toFixed(0) + '%' : '0%';

  const filledCount = [data.self, data.mentors.length > 0, data.peers.length > 0].filter(Boolean).length;
  const mentorLabel = data.mentors.length > 1 ? `Ментори · ${data.mentors.length}` : 'Ментор';
  const peerLabel = data.peers.length > 1 ? `Peer · ${data.peers.length}` : 'Peer';

  let html = `
    <div class="report-header">
      <div class="report-name"><strong>${name}</strong></div>
      <div class="report-meta">${role || 'Middle Fractional OM'} · Звіт після 3 місяців · ${filledCount}/3 форм заповнено</div>
    </div>

    <div class="summary-grid">
      <div class="summary-card ${!data.self ? 'empty' : ''}">
        <div class="sc-role self">Самооцінка</div>
        <div class="sc-avg">${avg('self') || '—'}</div>
        <div class="sc-label">${data.self ? 'середнє з 4' : 'не заповнено'}</div>
      </div>
      <div class="summary-card ${data.mentors.length === 0 ? 'empty' : ''}">
        <div class="sc-role mentor">${mentorLabel}</div>
        <div class="sc-avg">${avg('mentor') || '—'}</div>
        <div class="sc-label">${data.mentors.length > 0 ? 'середнє з 4' : 'не заповнено'}</div>
      </div>
      <div class="summary-card ${data.peers.length === 0 ? 'empty' : ''}">
        <div class="sc-role peer">${peerLabel}</div>
        <div class="sc-avg">${avg('peer') || '—'}</div>
        <div class="sc-label">${data.peers.length > 0 ? 'середнє з 4' : 'не заповнено'}</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">Gap Analysis · 12 критеріїв</div>

      <div class="legend-block">
        <div class="legend-title">Як читати цей звіт</div>
        <div class="legend-grid">
          <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span><span>Самооцінка — як менеджер бачить себе</span></div>
          <div class="legend-item"><span class="legend-dot" style="background:var(--amber)"></span><span>Ментор — оцінка від Delivery/керівника</span></div>
          <div class="legend-item"><span class="legend-dot" style="background:var(--teal)"></span><span>Peer — оцінка від колег по команді</span></div>
        </div>
        <div class="legend-scale">
          <div class="legend-scale-item"><span class="scale-badge">1</span> Не відповідає очікуванням Middle OM</div>
          <div class="legend-scale-item"><span class="scale-badge">2</span> Частково — є але нестабільно</div>
          <div class="legend-scale-item"><span class="scale-badge">3</span> Стабільно — демонструє без нагадувань</div>
          <div class="legend-scale-item"><span class="scale-badge">4</span> Перевищує — робить глибше ніж очікується</div>
        </div>
        <div class="legend-gaps">
          <span class="gap-badge gap-ok">Збіг</span> розрив ≤0.5 · 
          <span class="gap-badge gap-warn">±1.0</span> є відмінності · 
          <span class="gap-badge gap-crit">Розрив</span> >1 — потребує обговорення
        </div>
      </div>

  `;
  html += '<div class="criteria-grid">';

  CRITERIA_12.forEach(c => {
    const sv = scores.self[c];
    const mv = scores.mentor[c];
    const pv = scores.peer[c];
    html += `
      <div class="criterion-row">
        <div class="cr-label">${CRITERIA_LABELS[c]}${gapBadge(sv, mv)}</div>
        <div class="cr-desc">${CRITERIA_DESC[c]}</div>
        <div class="bars">
          ${sv !== null ? `<div class="bar-row"><span class="bar-role" style="color:var(--green)">Самооцінка</span><div class="bar-track"><div class="bar-fill self" style="width:${barPct(sv)}"></div></div><span class="bar-val">${sv}</span></div>` : ''}
          ${mv !== null ? `<div class="bar-row"><span class="bar-role" style="color:var(--amber)">${mentorLabel}</span><div class="bar-track"><div class="bar-fill mentor" style="width:${barPct(mv)}"></div></div><span class="bar-val">${mv}</span></div>` : ''}
          ${pv !== null ? `<div class="bar-row"><span class="bar-role" style="color:var(--teal)">${peerLabel}</span><div class="bar-track"><div class="bar-fill peer" style="width:${barPct(pv)}"></div></div><span class="bar-val">${pv}</span></div>` : ''}
          ${sv === null && mv === null && pv === null ? '<span class="ip-na">Дані відсутні</span>' : ''}
        </div>
      </div>`;
  });

  html += '</div></div>';

  // Ipsative — новий формат з прикладами
  html += `<div class="section"><div class="section-header">OpsLab-підхід · Ipsative відповіді</div>
    <div class="legend-block" style="margin-bottom:14px;">
      <div class="legend-title">Як читати ipsative відповіді</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px;">
        Для кожної ситуації менеджер і ментор обирали між двома варіантами — обидва звучать прийнятно, але описують різну логіку мислення. Немає очевидно "правильного" варіанту, тому вибір показує реальний підхід.
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);">
          <span style="display:inline-block;padding:3px 10px;border-radius:12px;background:var(--green-bg);color:var(--green);border:1px solid var(--green-b);font-size:11px;font-weight:500;">OpsLab підхід</span>
          Варіант Б — діагностує глибше, бере відповідальність, говорить чесно
        </div>
        <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);">
          <span style="display:inline-block;padding:3px 10px;border-radius:12px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-b);font-size:11px;font-weight:500;">Альтернативний</span>
          Варіант А — теж прийнятний але менш глибокий підхід
        </div>
        <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);">
          <span style="display:inline-block;padding:3px 10px;border-radius:12px;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-b);font-size:11px;font-weight:500;">Збіг</span>
          Менеджер і ментор обрали однаково
        </div>
      </div>
    </div>`;

  const IP_EXAMPLE_COLS = {
    'валідація_запиту': 'example_1',
    'стійкість_під_тиском': 'example_2',
    'відповідальність': 'example_3',
    'відвертість_у_стосунках': 'example_4'
  };
  const IP_EXAMPLE_LABELS_MAP = {
    'валідація_запиту': 'Останній запит від клієнта',
    'стійкість_під_тиском': 'Момент коли клієнт тиснув',
    'відповідальність': 'Ситуація де щось пішло не так',
    'відвертість_у_стосунках': 'Момент де міг підсвітити незручне'
  };

  Object.keys(IP_LABELS).forEach(c => {
    const ip = IP_LABELS[c];
    const selfChoice = data.self ? getVal(data.self, 'ipsative_' + c) : null;
    const mentorChoice = data._getIpsative ? data._getIpsative('mentor', 'ipsative_' + c) : null;
    const selfExample = data.self ? getVal(data.self, IP_EXAMPLE_COLS[c]) : null;
    const mentorExample = data.mentors.length > 0 ? getVal(data.mentors[0], IP_EXAMPLE_COLS[c]) : null;
    const choicesMatch = selfChoice && mentorChoice && selfChoice === mentorChoice;

    const pillClass = (choice) => {
      if (!choice) return '';
      if (choicesMatch) return 'match';
      return choice === 'B' ? 'opslab' : 'alt';
    };

    const selfPill = selfChoice ? '<div class="ip-choice-pill ' + pillClass(selfChoice) + '"><span class="ip-pill-role">Я</span>' + ip[selfChoice] + '</div>' : '';
    const mentorPill = mentorChoice ? '<div class="ip-choice-pill ' + pillClass(mentorChoice) + '"><span class="ip-pill-role">Ментор</span>' + ip[mentorChoice] + '</div>' : '';
    const selfEx = selfExample ? '<div class="ip-example-self"><span class="ip-role-tag" style="color:var(--green)">Я</span>' + selfExample + '</div>' : '';
    const mentorEx = mentorExample ? '<div class="ip-example-mentor"><span class="ip-role-tag" style="color:var(--amber)">Ментор</span>' + mentorExample + '</div>' : '';
    const exampleBlock = (selfExample || mentorExample) ? '<div class="ip-example"><div class="ip-example-label">' + IP_EXAMPLE_LABELS_MAP[c] + '</div>' + selfEx + mentorEx + '</div>' : '';

    const variantsBlock = '<div class="ip-variants">' +
      '<div class="ip-variant ' + (selfChoice === 'A' || mentorChoice === 'A' ? 'highlighted-a' : '') + '"><span class="ip-v-label">А</span>' + ip.A + '</div>' +
      '<div class="ip-variant ' + (selfChoice === 'B' || mentorChoice === 'B' ? 'highlighted-b' : '') + '"><span class="ip-v-label">Б</span>' + ip.B + '</div>' +
      '</div>';
    const opsNote = '<div class="ip-opslab-note">' + ip.opslab_note + '</div>';
    const selfQ = '<div class="ip-q-label" style="color:var(--green)">Я: ' + ip.question_self + '</div>';
    const mentorQ = '<div class="ip-q-label" style="color:var(--amber)">Ментор: ' + ip.question_mentor + '</div>';

    html += '<div class="ip-block">' +
      '<div class="ip-header"><div class="ip-criterion">' + ip.q + '</div><div class="ip-choices">' + selfPill + mentorPill + '</div></div>' +
      selfQ + mentorQ +
      variantsBlock + opsNote +
      exampleBlock + '</div>';
  });

  html += '</div>';

  const peerTrust = data._getAvgVal ? data._getAvgVal('peer', 'trust_score') : null;
  const mentorCount = data._mentorCount ? ` · ${data._mentorCount} ментори` : '';
  const peerCount = data._peerCount ? ` · ${data._peerCount} peer` : '';

    html += `<div class="redflag-list">`;

    html += `<div class="open-block"><span class="no-flags">Червоних прапорців не зафіксовано</span></div>`;
  }
  html += `</div>`;

  // Open questions — двоколонковий layout: самооцінка зліва, ментор справа
  html += `<div class="section"><div class="section-header">Відкриті питання та рефлексія</div>`;
  html += `<div class="open-intro">Відповіді менеджера і ментора на однакові питання — поруч для порівняння.</div>`;

  const selfRow = data.self;
  const mentorRow = data.mentors.length > 0 ? data.mentors[0] : null;

  const sharedQs = [
    { q: 'Найсильніший момент за 3 місяці', selfKey: 'open_1', mentorKey: 'open_1' },
    { q: 'Системний виклик / що давалось найважче', selfKey: 'open_2', mentorKey: 'open_2' },
  ];

  sharedQs.forEach(({q, selfKey, mentorKey}) => {
    const sv = selfRow ? getVal(selfRow, selfKey) : null;
    const mv = mentorRow ? getVal(mentorRow, mentorKey) : null;
    if (!sv && !mv) return;
    html += `<div class="open-compare-block">
      <div class="ocb-q">${q}</div>
      <div class="ocb-cols">

        </div>
        <div class="ocb-col">
          <div class="ocb-role" style="color:var(--amber)">Ментор</div>
          <div class="ocb-text">${mv || '<span style="color:var(--hint);font-style:italic">Не заповнено</span>'}</div>
        </div>

  const selfOpen3 = selfRow ? getVal(selfRow, 'open_3') : null;
  if (selfOpen3) {

      <div class="open-role" style="color:var(--green)">Самооцінка</div>
      <div class="open-q">Якби починав знову — що б зробив інакше?</div>
      <div class="open-a">${selfOpen3}</div>
    </div>`;
  }

  // Mentor open_4 — що змінити в онбордингу
  const mentorOpen4 = mentorRow ? getVal(mentorRow, 'open_4') : null;
  if (mentorOpen4) {
    html += `<div class="open-block">
      <div class="open-role" style="color:var(--amber)">Ментор</div>
      <div class="open-q">Що змінити в онбордингу для наступних?</div>
      <div class="open-a">${mentorOpen4}</div>
    </div>`;
  }

  // Peer відкриті
  data.peers.forEach((row, idx) => {
    const pLabel = data.peers.length > 1 ? `Peer ${idx+1}` : 'Peer';
    ['open_1','open_2'].forEach((k, i) => {
      const val = getVal(row, k);
      if (!val || !val.trim()) return;
      html += `<div class="open-block">
        <div class="open-role" style="color:var(--teal)">${pLabel}</div>
        <div class="open-q">${OPEN_QUESTIONS.peer[i]}</div>
        <div class="open-a">${val}</div>
      </div>`;
    });
  });

  html += `</div>`;

  // Decision
  const decision = data.mentors.length > 0 ? getVal(data.mentors[0], 'open_3') : null;
  if (decision && decision.trim()) {
    html += `
      <div class="section">
        <div class="section-header">Рішення після випробувального</div>
        <div class="decision-block">
          <div class="decision-label">Ментор · Фінальне рішення</div>
          <div class="decision-text">${decision}</div>
        </div>
      </div>`;
  }



  // === INTERPRETATION BLOCK ===
  const allScores = CRITERIA_12.map(c => ({
    label: CRITERIA_LABELS[c], key: c,
    self: scores.self[c], mentor: scores.mentor[c], peer: scores.peer[c]
  })).filter(s => s.mentor !== null);

  const matches = allScores.filter(s => s.self !== null && Math.abs(s.self - s.mentor) <= 0.5)
    .sort((a,b) => b.mentor - a.mentor).slice(0,3);
  const gaps = allScores.filter(s => s.self !== null && Math.abs(s.self - s.mentor) > 1)
    .sort((a,b) => Math.abs(b.self - b.mentor) - Math.abs(a.self - a.mentor)).slice(0,3);
  const strengths = allScores.filter(s => s.mentor >= 3.5);
  const growthAreas = allScores.filter(s => s.mentor <= 2);

  const validScores = allScores.filter(s => s.mentor !== null);
  const mentorAvgNum = validScores.length ? validScores.reduce((a,b)=>a+b.mentor,0)/validScores.length : 0;

  let gradeText, gradeColor;
  if (mentorAvgNum >= 3.5) { gradeText = 'Грейд підтверджено з запасом'; gradeColor = 'var(--green)'; }
  else if (mentorAvgNum >= 2.8) { gradeText = 'Грейд підтверджено'; gradeColor = 'var(--green)'; }
  else if (mentorAvgNum >= 2.2) { gradeText = 'Грейд під питанням — є системні зони нижче очікувань'; gradeColor = 'var(--amber)'; }
  else { gradeText = 'Грейд не підтверджено'; gradeColor = 'var(--red)'; }

  const ipRes = Object.keys(IP_LABELS).map(c => ({
    label: IP_LABELS[c].q,
    selfB: data.self ? getVal(data.self, 'ipsative_' + c) === 'B' : null,
    mentorB: data._getIpsative ? data._getIpsative('mentor', 'ipsative_' + c) === 'B' : null
  }));
  const selfOpslabCount = ipRes.filter(r => r.selfB === true).length;
  const mentorOpslabCount = ipRes.filter(r => r.mentorB === true).length;

  const itemHtml = (s, color) => '<div class="interp-item"><span class="interp-dot" style="background:'+color+'"></span>'+s+'</div>';

  html += '<div class="section"><div class="section-header">Інтерпретація · Загальний висновок</div>';
  html += '<div class="interp-grade" style="border-color:'+gradeColor+';background:'+gradeColor+'22">' +
    '<div class="interp-grade-label" style="color:'+gradeColor+'">'+(role||'Middle Fractional OM')+' · Грейд</div>' +
    '<div class="interp-grade-text">'+gradeText+'</div>' +
    '<div class="interp-grade-avg">Середня оцінка ментора: <strong>'+mentorAvgNum.toFixed(1)+'</strong> / 4</div>' +
    '</div>';

  html += '<div class="interp-grid">';
  if (strengths.length) html += '<div class="interp-card"><div class="interp-card-title" style="color:var(--green)">Сильні сторони · ментор ≥ 3.5</div>' + strengths.map(s=>itemHtml(s.label,'var(--green)')).join('') + '</div>';
  if (growthAreas.length) html += '<div class="interp-card"><div class="interp-card-title" style="color:var(--amber)">Зони росту · ментор ≤ 2</div>' + growthAreas.map(s=>itemHtml(s.label,'var(--amber)')).join('') + '</div>';
  if (matches.length) html += '<div class="interp-card"><div class="interp-card-title" style="color:var(--blue)">Збіг в оцінці</div><div class="interp-sub">Самооцінка і ментор бачать однаково</div>' + matches.map(s=>itemHtml(s.label+' ('+s.self+' / '+s.mentor+')','var(--blue)')).join('') + '</div>';
  if (gaps.length) html += '<div class="interp-card"><div class="interp-card-title" style="color:var(--red)">Розриви в оцінці</div><div class="interp-sub">Варто обговорити на фінальній зустрічі</div>' + gaps.map(s=>itemHtml(s.label+' — я: '+s.self+', ментор: '+s.mentor,'var(--red)')).join('') + '</div>';
  html += '</div>';

  html += '<div class="interp-opslab">' +
    '<div class="interp-card-title" style="color:var(--purple)">OpsLab-підхід на рівні мислення</div>' +
    '<div class="interp-sub" style="margin-bottom:12px">Скільки разів обрано OpsLab-підхід (варіант Б) з 4 ipsative питань</div>' +
    '<div style="display:flex;gap:28px">' +
    '<div><span style="color:var(--green);font-size:28px;font-weight:300">'+selfOpslabCount+'/'+ipRes.length+'</span><div style="font-size:11px;color:var(--muted);margin-top:3px">Самооцінка</div></div>' +
    '<div><span style="color:var(--amber);font-size:28px;font-weight:300">'+mentorOpslabCount+'/'+ipRes.length+'</span><div style="font-size:11px;color:var(--muted);margin-top:3px">Ментор бачить</div></div>' +
    '</div></div>';
  html += '</div>';

  // === COMMENT FIELD ===
  const mgNameForComment = name;
  html += '<div class="section"><div class="section-header">Коментар після фінальної розмови</div>' +
    '<div class="comment-intro">Заповни після того як обговорили звіт. Відправляється окремо в таблицю.</div>' +
    '<textarea class="mentor-comment" id="mentor-comment" placeholder="Фінальний коментар, домовленості, наступні кроки..."></textarea>' +
    '<button class="comment-btn" onclick="submitComment(\''+mgNameForComment+'\')">Зберегти коментар</button>' +
    '<div class="comment-status" id="comment-status"></div>' +
    '</div>';


      const reportEl = document.getElementById('report');
  reportEl.innerHTML = html;
  reportEl.style.display = 'block';
  reportEl.scrollIntoView({ behavior: 'smooth' });
}

function setStatus(msg) {
  document.getElementById('search-status').textContent = msg;
}

async function submitComment(managerName) {
  const comment = document.getElementById('mentor-comment').value.trim();
  if (!comment) { alert('Введи коментар перш ніж зберегти'); return; }
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Зберігаємо...';
  try {
    await fetch('https://hooks.zapier.com/hooks/catch/14002247/4bh0i7c/', {
      method: 'POST', mode: 'no-cors',
      body: JSON.stringify({
        timestamp: new Date().toISOString(),
        evaluator_role: 'final_comment',
        evaluator_name: 'Ментор',
        manager_name: managerName,
        open_1: comment
      })
    });
    document.getElementById('comment-status').textContent = '✓ Коментар збережено';
    document.getElementById('comment-status').style.color = 'var(--green)';
  } catch(e) {
    document.getElementById('comment-status').textContent = 'Помилка. Спробуй ще раз.';
    document.getElementById('comment-status').style.color = 'var(--red)';
    btn.disabled = false;
    btn.textContent = 'Зберегти коментар';
  }
}

document.getElementById('manager-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadReport();
});

async function loadAvailable() {
  try {
    const res = await fetch(SHEET_URL + '&sheet=Sheet1');
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const rows = json.table.rows;
    const cols = json.table.cols.map(c => c.label.trim());

    const getVal = (row, colName) => {
      let idx = cols.findIndex(c => c.trim() === colName.trim());
      if (idx < 0 && colName === 'manager_name') {
        idx = cols.findIndex(c => c.trim().startsWith('manager_nam'));
      }
      if (idx < 0) return null;
      const cell = row.c[idx];
      return cell && cell.v !== null ? String(cell.v).trim() : null;
    };

    // Збираємо унікальних менеджерів і які ролі вже заповнили
    const managers = {};
    rows.forEach(row => {
      if (!row.c || row.c.every(cell => !cell || cell.v === null)) return;
      const mn = getVal(row, 'manager_name');
      const role = getVal(row, 'evaluator_role');
      if (!mn) return;
      if (!managers[mn]) managers[mn] = { self: false, mentor: false, peer: false };
      if (role) managers[mn][role] = true;
    });

    if (Object.keys(managers).length === 0) return;

    const list = document.getElementById('available-list');
    list.innerHTML = '';

    Object.entries(managers).forEach(([name, roles]) => {
      const total = [roles.self, roles.mentor, roles.peer].filter(Boolean).length;
      const card = document.createElement('div');
      card.style.cssText = 'background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:10px 14px;cursor:pointer;transition:border-color .15s;';
      card.onmouseenter = () => card.style.borderColor = 'var(--blue-b)';
      card.onmouseleave = () => card.style.borderColor = 'var(--border2)';
      card.onclick = () => {
        document.getElementById('manager-input').value = name;
        loadReport();
      };

      const dots = [
        { role: 'self', color: 'var(--green)', label: 'С' },
        { role: 'mentor', color: 'var(--amber)', label: 'М' },
        { role: 'peer', color: 'var(--teal)', label: 'P' },
      ].map(d => `<span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:${roles[d.role] ? d.color : 'var(--s3)'};font-family:'DM Mono',monospace;font-size:8px;font-weight:500;color:${roles[d.role] ? 'var(--bg)' : 'var(--hint)'};">${d.label}</span>`).join('');

      card.innerHTML = `
        <div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px;">${name}</div>
        <div style="display:flex;align-items:center;gap:4px;">${dots}<span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-left:4px;">${total}/3</span></div>
      `;
      list.appendChild(card);
    });

    document.getElementById('available-block').style.display = 'block';
  } catch(e) {
    console.log('Could not load available reports', e);
  }
}

loadAvailable();
</script>
</body>
</html>
